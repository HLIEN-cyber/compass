    <line class="tick" x1="250" y1="58" x2="250" y2="50" transform="rotate(110,250,250)"/>
    <line class="tick" x1="250" y1="58" x2="250" y2="50" transform="rotate(115,250,250)"/>
    <line class="tick" x1="250" y1="58" x2="250" y2="50" transform="rotate(120,250,250)"/>
    <line class="tick" x1="250" y1="58" x2="250" y2="50" transform="rotate(125,250,250)"/>
    <line class="tick" x1="250" y1="58" x2="250" y2="50" transform="rotate(130,250,250)"/>
