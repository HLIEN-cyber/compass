<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <style>
      .bg { fill: #e8e9eb; }
      .outer-ring { fill: none; stroke: #8a8a8a; stroke-width: 3; opacity: 0.7; }
      .inner-ring { fill: none; stroke: #8a8a8a; stroke-width: 2; opacity: 0.6; }
      .circle-fill { fill: #2d5f8a; }
      .circle-border { fill: none; stroke: #7a8fa0; stroke-width: 4; opacity: 0.8; }
      .compass-line { stroke: #6a7a8a; stroke-width: 1.5; opacity: 0.5; }
      .compass-line-dark { stroke: #5a6a7a; stroke-width: 2; opacity: 0.6; }
      .spoke { stroke: #7a8a9a; stroke-width: 2.5; opacity: 0.75; }
      .spoke-thin { stroke: #8a9aaa; stroke-width: 1.5; opacity: 0.6; }
      .text-main { font-family: 'Garamond', 'Times New Roman', serif; font-size: 82px; font-weight: bold; fill: #f0f0f0; letter-spacing: 3px; }
      .text-est { font-family: 'Garamond', 'Times New Roman', serif; font-size: 22px; fill: #d0d8e0; letter-spacing: 4px; }
      .star { fill: #d0d8e0; }
      .tick { stroke: #8a9aaa; stroke-width: 1.5; opacity: 0.6; }
    </style>
    <filter id="distress" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="multiply" result="blend"/>
      <feComposite in="blend" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect class="bg" width="500" height="500"/>

  <!-- Outer diagonal spokes (8 directions) -->
  <!-- Cardinal spokes (longer) -->
  <line class="spoke" x1="250" y1="80" x2="250" y2="30"/>
  <line class="spoke" x1="250" y1="420" x2="250" y2="470"/>
  <line class="spoke" x1="80" y1="250" x2="30" y2="250"/>
  <line class="spoke" x1="420" y1="250" x2="470" y2="250"/>

  <!-- Diagonal spokes (shorter) -->
  <line class="spoke-thin" x1="153" y1="153" x2="113" y2="113"/>
  <line class="spoke-thin" x1="347" y1="153" x2="387" y2="113"/>
  <line class="spoke-thin" x1="153" y1="347" x2="113" y2="387"/>
  <line class="spoke-thin" x1="347" y1="347" x2="387" y2="387"/>

  <!-- Outer decorative ring -->
  <circle class="outer-ring" cx="250" cy="250" r="195"/>
  <!-- Second outer ring -->
  <circle class="outer-ring" cx="250" cy="250" r="188" style="opacity:0.4;stroke-width:1"/>

  <!-- Tick marks around outer ring -->
  <g id="ticks">
