  <!-- EST.2025 Text -->
  <text class="text-est" x="250" y="308" text-anchor="middle">EST.2025</text>

  <!-- Decorative dots flanking EST.2025 -->
  <circle cx="178" cy="308" r="2" fill="#a0b8c8" opacity="0.7"/>
