  <!-- Inner border on blue circle -->
  <circle class="circle-border" cx="250" cy="250" r="162"/>
  <circle cx="250" cy="250" r="155" fill="none" stroke="#4a7a9a" stroke-width="1.5" opacity="0.5"/>

  <!-- Compass rose lines inside blue circle -->
  <!-- Main cross lines -->
