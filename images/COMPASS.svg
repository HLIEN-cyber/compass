  <line class="compass-line-dark" x1="90" y1="250" x2="410" y2="250" opacity="0.3"/>
  <!-- Diagonal lines -->
  <line class="compass-line" x1="135" y1="135" x2="365" y2="365" opacity="0.2"/>
  <line class="compass-line" x1="365" y1="135" x2="135" y2="365" opacity="0.2"/>

  <!-- Stars (upper left area of circle) -->
  <!-- Star 1 (larger) -->
  <polygon class="star" points="193,148 196,158 206,158 198,164 201,174 193,168 185,174 188,164 180,158 190,158" transform="scale(0.75) translate(68,62)"/>
  <!-- Star 2 (smaller, 4-pointed) -->
  <polygon class="star" points="222,136 223.5,141 228,142.5 223.5,144 222,149 220.5,144 216,142.5 220.5,141" opacity="0.85"/>
  <!-- Star 3 (tiny) -->
