<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>學習資源 | COMPASS</title>
  <style>
    :root {
      --primary: #7a9bc0;
      --border: rgba(80, 96, 120, 0.15);
      --bg: #f8f5f1;
      --text: #2f3a4a;
      --muted: #6b7686;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, "Noto Sans TC", sans-serif;
      background:
        radial-gradient(circle at 15% 20%, rgba(205,184,216,0.22), transparent 28%),
        radial-gradient(circle at 80% 12%, rgba(159,183,217,0.18), transparent 30%),
        radial-gradient(circle at 85% 75%, rgba(199,217,204,0.2), transparent 32%),
        linear-gradient(180deg, #fbf8f4 0%, #f6f2ed 100%);
      color: var(--text);
      padding: 24px;
      min-height: 100vh;
    }

    /* Parallax background layer */
    .bg-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .bg-qmark {
      position: absolute;
      right: -40px;
      bottom: -20px;
      width: 460px;
      opacity: 0.38;
      filter: drop-shadow(0 12px 18px rgba(120,128,145,0.06));
      transform: translateY(calc(var(--scroll, 0) * -0.06px));
    }
    .bg-figure {
      position: absolute;
      right: 40px;
      bottom: 60px;
      width: 280px;
      opacity: 0.45;
      filter: drop-shadow(0 12px 18px rgba(120,128,145,0.08));
      transform: translateY(calc(var(--scroll, 0) * -0.12px));
    }
    .bg-bubble {
      position: absolute;
      right: 160px;
      bottom: 330px;
      width: 160px;
      opacity: 0.4;
      transform: translateY(calc(var(--scroll, 0) * -0.18px));
    }

    @media (prefers-reduced-motion: reduce) {
      .bg-qmark, .bg-figure, .bg-bubble { transform: none !important; }
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.74);
      border: 1px solid rgba(255, 255, 255, 0.55);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 18px 45px rgba(90, 105, 125, 0.12);
      backdrop-filter: blur(18px);
      position: relative;
      z-index: 1;
    }
    .header {
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .header h1 { margin: 0; font-size: 1.2rem; }
    .back-link { color: var(--primary); text-decoration: none; font-weight: 600; }
    .tabs { display: flex; border-bottom: 1px solid var(--border); background: rgba(248, 245, 241, 0.8); }
    .tab-btn {
      flex: 1;
      border: 0;
      background: transparent;
      padding: 14px;
      font-size: 1rem;
      font-weight: 700;
      color: var(--muted);
      cursor: pointer;
    }
    .tab-btn.active {
      background: rgba(255, 255, 255, 0.85);
      color: var(--primary);
      border-top: 3px solid var(--primary);
    }
    .panel { display: none; }
    .panel.active { display: block; }
    iframe {
      width: 100%;
      height: 0;
      border: 0;
      display: block;
      background: white;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <!-- Parallax decorative background -->
  <div class="bg-layer" aria-hidden="true">
    <!-- Large question mark base -->
    <svg class="bg-qmark" viewBox="0 0 300 380" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M150 20c-60 0-108 48-108 108 0 36 18 68 46 88l14 10v48" stroke="#c3cfbf" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="rgba(255,255,255,0.18)"/>
      <path d="M102 118c0-26 22-48 48-48s48 22 48 48c0 20-12 38-30 46" stroke="#cdb8d8" stroke-width="10" stroke-linecap="round"/>
      <circle cx="150" cy="334" r="20" stroke="#c3cfbf" stroke-width="12" fill="rgba(255,255,255,0.24)"/>
    </svg>

    <!-- Figure sitting on question mark -->
    <svg class="bg-figure" viewBox="0 0 200 260" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Body/torso -->
      <path d="M80 160c0-12 10-22 22-22h16c12 0 22 10 22 160v32" stroke="#8da2bd" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="rgba(255,255,255,0.28)"/>
      <path d="M80 192v32M120 192v32" stroke="#7d8fa7" stroke-width="5" stroke-linecap="round"/>
      <!-- Torso filled shape -->
      <path d="M80 160c0-12 10-22 22-22h16c12 0 22 10 22 22v32H80z" fill="rgba(255,255,255,0.32)" stroke="#8da2bd" stroke-width="4" stroke-linejoin="round"/>
      <!-- Head -->
      <circle cx="100" cy="124" r="24" fill="rgba(255,255,255,0.36)" stroke="#879ab4" stroke-width="4"/>
      <!-- Hair -->
      <path d="M80 114c2-14 10-24 20-26 10-2 22 4 24 16" stroke="#c8b5d6" stroke-width="4" stroke-linecap="round"/>
      <!-- Neck -->
      <path d="M100 148v14" stroke="#7f92ac" stroke-width="5" stroke-linecap="round"/>
      <!-- Left arm holding mic -->
      <path d="M80 172l-24 20" stroke="#7d8fa7" stroke-width="5" stroke-linecap="round"/>
      <!-- Mic in hand -->
      <rect x="38" y="188" width="12" height="22" rx="6" fill="rgba(255,255,255,0.42)" stroke="#8193aa" stroke-width="3"/>
      <!-- Right arm resting -->
      <path d="M120 172l22 14" stroke="#c8b5d6" stroke-width="4" stroke-linecap="round"/>
      <!-- Legs dangling -->
      <path d="M88 192l-10 40M112 192l10 40" stroke="#7d8fa7" stroke-width="5" stroke-linecap="round"/>
      <!-- Feet -->
      <path d="M78 232l-14 4M122 232l14 4" stroke="#8da2bd" stroke-width="4" stroke-linecap="round"/>
    </svg>

    <!-- Thought bubble -->
    <svg class="bg-bubble" viewBox="0 0 160 120" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M16 52c0-20 16-36 36-36h56c20 0 36 16 36 36v16c0 20-16 36-36 36H70l-18 14 4-14h-4c-20 0-36-16-36-36z" fill="rgba(255,255,255,0.42)" stroke="#c3cfbf" stroke-width="3" stroke-linejoin="round"/>
      <!-- Dots inside bubble -->
      <circle cx="62" cy="60" r="4" fill="#c8b5d6" opacity="0.7"/>
      <circle cx="80" cy="60" r="4" fill="#9fb7d9" opacity="0.7"/>
      <circle cx="98" cy="60" r="4" fill="#c3cfbf" opacity="0.7"/>
      <!-- Small trailing dots -->
      <circle cx="44" cy="106" r="5" fill="rgba(255,255,255,0.5)" stroke="#c3cfbf" stroke-width="2"/>
      <circle cx="36" cy="116" r="3.5" fill="rgba(255,255,255,0.4)" stroke="#c8b5d6" stroke-width="2"/>
    </svg>
  </div>

  <div class="container">
    <div class="header">
      <h1>學習資源</h1>
      <a class="back-link" href="index.html#resource">← 回到首頁</a>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="pf">Public Forum</button>
      <button class="tab-btn" data-tab="policy">Policy Debate</button>
    </div>

    <section id="pf" class="panel active">
      <iframe src="public-forum.html" title="Public Forum Vocabulary" scrolling="no"></iframe>
    </section>

    <section id="policy" class="panel">
      <iframe src="policy-debate.html" title="Policy Debate Vocabulary" scrolling="no"></iframe>
    </section>
  </div>

  <script>
    // Parallax scroll tracking
    const root = document.documentElement;
    const updateScroll = () => root.style.setProperty('--scroll', window.scrollY.toFixed(1));
    updateScroll();
    window.addEventListener('scroll', updateScroll, { passive: true });

    const tabs = document.querySelectorAll('.tab-btn');
    const panels = document.querySelectorAll('.panel');
    const frames = document.querySelectorAll('iframe');

    const resizeFrame = (frame) => {
      const doc = frame.contentDocument || frame.contentWindow?.document;
      if (!doc) return;

      const bodyHeight = doc.body ? doc.body.scrollHeight : 0;
      const htmlHeight = doc.documentElement ? doc.documentElement.scrollHeight : 0;
      frame.style.height = `${Math.max(bodyHeight, htmlHeight)}px`;
    };

    frames.forEach((frame) => {
      frame.addEventListener('load', () => {
        resizeFrame(frame);
        frame.contentWindow?.addEventListener('resize', () => resizeFrame(frame));
        setInterval(() => resizeFrame(frame), 400);
      });
    });

    tabs.forEach((tab) => {
      tab.addEventListener('click', () => {
        const target = tab.dataset.tab;

        tabs.forEach((item) => item.classList.remove('active'));
        panels.forEach((panel) => panel.classList.remove('active'));

        tab.classList.add('active');
        const activePanel = document.getElementById(target);
        activePanel.classList.add('active');

        const activeFrame = activePanel.querySelector('iframe');
        if (activeFrame) resizeFrame(activeFrame);
      });
    });
  </script>
</body>
</html>
