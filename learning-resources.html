<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>學習資源 | COMPASS</title>
  <style>
    :root {
      --primary: #7a9bc0;
      --border: rgba(80, 96, 120, 0.15);
      --bg: #f8f5f1;
      --text: #2f3a4a;
      --muted: #6b7686;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, "Noto Sans TC", sans-serif;
      background:
        radial-gradient(circle at 15% 20%, rgba(205,184,216,0.22), transparent 28%),
        radial-gradient(circle at 80% 12%, rgba(159,183,217,0.18), transparent 30%),
        radial-gradient(circle at 85% 75%, rgba(199,217,204,0.2), transparent 32%),
        linear-gradient(180deg, #fbf8f4 0%, #f6f2ed 100%);
      color: var(--text);
      padding: 24px;
      min-height: 100vh;
    }

    /* Parallax background layer */
    .bg-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    /* ── right side ── */
    .bg-character {
      position: absolute;
      right: -60px;
      bottom: -30px;
      width: 500px;
      opacity: 0.22;
      filter: brightness(1.6) saturate(0.25) contrast(0.85);
      transform: translateY(calc(var(--scroll, 0) * -0.10px));
      transform-origin: bottom right;
    }
    /* ── left side (mirrored) ── */
    .bg-character-l {
      position: absolute;
      left: -60px;
      bottom: -30px;
      width: 500px;
      opacity: 0.18;
      filter: brightness(1.6) saturate(0.25) contrast(0.85);
      transform: translateY(calc(var(--scroll, 0) * -0.10px)) scaleX(-1);
      transform-origin: bottom left;
    }

    @media (prefers-reduced-motion: reduce) {
      .bg-character, .bg-character-l { transform: none !important; }
    }

    @media (max-width: 900px) {
      .bg-character-l { display: none; }
      .bg-character { width: 360px; }
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.74);
      border: 1px solid rgba(255, 255, 255, 0.55);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 18px 45px rgba(90, 105, 125, 0.12);
      backdrop-filter: blur(18px);
      position: relative;
      z-index: 1;
    }
    .header {
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .header h1 { margin: 0; font-size: 1.2rem; }
    .back-link { color: var(--primary); text-decoration: none; font-weight: 600; }
    .tabs { display: flex; border-bottom: 1px solid var(--border); background: rgba(248, 245, 241, 0.8); }
    .tab-btn {
      flex: 1;
      border: 0;
      background: transparent;
      padding: 14px;
      font-size: 1rem;
      font-weight: 700;
      color: var(--muted);
      cursor: pointer;
    }
    .tab-btn.active {
      background: rgba(255, 255, 255, 0.85);
      color: var(--primary);
      border-top: 3px solid var(--primary);
    }
    .panel { display: none; }
    .panel.active { display: block; }
    iframe {
      width: 100%;
      height: 0;
      border: 0;
      display: block;
      background: white;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <!-- Parallax decorative background -->
  <div class="bg-layer" aria-hidden="true">
    <img class="bg-character" src="images/debate character.png" alt="" />
    <img class="bg-character-l" src="images/debate character.png" alt="" />
  </div>

  <div class="container">
    <div class="header">
      <h1>學習資源</h1>
      <a class="back-link" href="index.html#resource">← 回到首頁</a>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="pf">Public Forum</button>
      <button class="tab-btn" data-tab="policy">Policy Debate</button>
    </div>

    <section id="pf" class="panel active">
      <iframe src="public-forum.html" title="Public Forum Vocabulary" scrolling="no"></iframe>
    </section>

    <section id="policy" class="panel">
      <iframe src="policy-debate.html" title="Policy Debate Vocabulary" scrolling="no"></iframe>
    </section>
  </div>

  <script>
    // Parallax scroll tracking
    const root = document.documentElement;
    const updateScroll = () => root.style.setProperty('--scroll', window.scrollY.toFixed(1));
    updateScroll();
    window.addEventListener('scroll', updateScroll, { passive: true });

    const tabs = document.querySelectorAll('.tab-btn');
    const panels = document.querySelectorAll('.panel');
    const frames = document.querySelectorAll('iframe');

    const resizeFrame = (frame) => {
      const doc = frame.contentDocument || frame.contentWindow?.document;
      if (!doc) return;

      const bodyHeight = doc.body ? doc.body.scrollHeight : 0;
      const htmlHeight = doc.documentElement ? doc.documentElement.scrollHeight : 0;
      frame.style.height = `${Math.max(bodyHeight, htmlHeight)}px`;
    };

    frames.forEach((frame) => {
      frame.addEventListener('load', () => {
        resizeFrame(frame);
        frame.contentWindow?.addEventListener('resize', () => resizeFrame(frame));
        setInterval(() => resizeFrame(frame), 400);
      });
    });

    tabs.forEach((tab) => {
      tab.addEventListener('click', () => {
        const target = tab.dataset.tab;

        tabs.forEach((item) => item.classList.remove('active'));
        panels.forEach((panel) => panel.classList.remove('active'));

        tab.classList.add('active');
        const activePanel = document.getElementById(target);
        activePanel.classList.add('active');

        const activeFrame = activePanel.querySelector('iframe');
        if (activeFrame) resizeFrame(activeFrame);
      });
    });
  </script>
</body>
</html>
